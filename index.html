<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0920">
  <meta name="referrer" content="no-referrer">
  <title>Physics Atlas</title>
  <link rel="preload" href="fonts/dela-gothic-one-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/bangers-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Map">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M18 2 6 18h8l-2 12 14-18h-9l1-10z"/></svg>
      <span class="brand-name" data-i18n="app.name">Physics Atlas</span>
    </a>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <div class="crystals" id="crystals" role="status" aria-label="Energy crystals">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1 19 8 15 19H5L1 8z"/></svg><span id="crystal-count">0</span>
    </div>
  </header>
  <main id="view" tabindex="-1" aria-live="polite">
    <noscript><p class="panel">This app needs JavaScript.</p></noscript>
  </main>
</body>
</html>
